<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Partitioning Visualizer</title>
  <style>
    .editorim-sidebox-open { display: none !important; }

    @media (min-width: 501px) {
      #embedimAccessibilityWidget .editorim-sidebox {
        left: 10px !important;
        right: auto !important;
      }
    }
  </style>
  <script>
    (function () {
      var stored = null;
      try { stored = window.localStorage.getItem('darkMode'); } catch (e) { }
      var isDark = stored === null
        ? window.matchMedia('(prefers-color-scheme: dark)').matches
        : stored === 'true';
      document.documentElement.classList.add(isDark ? 'dark' : 'light');
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script src="https://app.embed.im/accessibility.js" defer></script>
</body>

</html>
